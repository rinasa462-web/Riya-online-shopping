
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riya Online Shopping - Contact Us</title>
</head>
<body>

    <header>
        <h1>Contact Riya Online Shopping</h1>
        <p>We would love to hear from you!</p>
    </header>

    <nav>
        <a href="../index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="gifts.html">Gift Packages</a>
        <a href="pages/about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
    </nav>

    <main>
        <section>
            <h2>Send Us a Message</h2>

            <form action="#" method="post">

                <p>
                    <label for="name">Full Name:</label><br>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="subject">Subject:</label><br>
                    <input type="text" id="subject" name="subject">
                </p>

                <p>
                    <label for="message">Your Message:</label><br>
                    <textarea id="message" name="message"
                              rows="5" cols="30" required></textarea>
                </p>

                <input type="submit" value="Send Message">
                <input type="reset" value="Clear Form">


            </form>
        </section>

        <section>
            <h2>Other Ways to Contact Us</h2>
            <p>Email:
                <a href="mailto:riya@example.com">
                    Contact Riya Online Shopping
                </a>
            </p>
        </section>
    </main>

    <footer>
        <p>Copyright 2026 Riya Online Shopping</p>
    </footer>

</body>
</html>
